                            runAsUser to be set as well.
                          format: int64
                          minimum: 0
                          type: integer
                        runAsUser:
                          description: RunAsUser is the numeric Unix user ID used
                            by the container.
                          format: int64
                          minimum: 0
                          type: integer
                      type: object
                    volumeMounts:

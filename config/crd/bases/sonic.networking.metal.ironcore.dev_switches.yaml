kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: switches.sonic.networking.metal.ironcore.dev
spec:
  group: sonic.networking.metal.ironcore.dev
  names:
    kind: Switch
    listKind: SwitchList
    plural: switches
    singular: switch
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.macAddress
      name: MACAddress
      type: string
    - jsonPath: .status.state
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Switch is the Schema for the switch API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Switch
            properties:
              containers:
                description: |-
                  Containers are started with host networking and Docker's unless-stopped
                  restart policy by --ztp-mode=generated.
                items:
                  description: |-
                    Container declares a Docker container that the provisioning server starts on
                    the switch during generated ZTP provisioning.
                  properties:
                    args:
                      description: Args are appended after Command, or after the image
                        entrypoint when Command is empty.
                      items:
                        type: string
                      type: array
                    command:
                      description: Command overrides the image entrypoint.
                      items:
                        type: string
                      type: array
                    image:
                      description: Image is the container image pulled by Docker on
                        the switch.
                      minLength: 1
                      type: string
                    injectControlKubeconfig:
                      description: |-
                        InjectControlKubeconfig mounts the operator's configured control kubeconfig
                        into this container and sets KUBECONFIG to its in-container path. A
                        securityContext with runAsUser is required so the generated script can
                        grant access to a private, per-container credential file.
                      type: boolean
                    name:
                      description: Name is both the Docker container name and its
                        stable identity on the switch.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    securityContext:

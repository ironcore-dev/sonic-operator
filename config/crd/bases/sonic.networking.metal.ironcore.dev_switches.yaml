                    x-kubernetes-map-type: atomic
                  host:
                    type: string
                  port:
                    type: string
                required:
                - credentials
                - host
                - port
                type: object
              nextBootMode:
                description: |-
                  NextBootMode declares the desired behavior of the next boot. The default
                  is None. It is configured by --ztp-mode=generated.
                enum:
                - None
                - InstallOS
                type: string
              ports:
                description: Ports the physical ports available on the Switch.
                items:
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              volumes:
                description: |-
                  Volumes are named storage sources available to containers. Generated ZTP
                  currently supports hostPath volumes only.
                items:
                  description: |-
                    Volume represents a named storage volume made available to Switch containers.
                    It follows the Kubernetes Pod volume model. Generated ZTP currently supports
                    hostPath volumes only.
                  properties:
                    hostPath:
                      description: HostPath represents a pre-existing file or directory
                        on the SONiC host.
                      properties:
                        path:
                          description: Path is the absolute path on the SONiC host.
                          type: string
                        type:
                          description: |-
                            Type describes the expected host-path type, following the Kubernetes Pod
                            hostPath API. Generated ZTP does not create missing paths.
                          type: string
                      required:
                      - path
                      type: object
                    name:
                      description: Name is the stable volume identity referenced by
                        Container.VolumeMounts.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              ztp:
                description: ZTP identifies the switch while it requests its initial
                  provisioning script.
                properties:
                  scriptRef:
                    description: |-
                      ScriptRef identifies the complete script served when --ztp-mode=configmap.
                      It is not used by --ztp-mode=generated.
